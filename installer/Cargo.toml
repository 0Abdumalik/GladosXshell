[package]
name = "gladosxshell-setup"
description = "GladosXshell installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-dialog = "=2.8.0"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
