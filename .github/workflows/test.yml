name: Test

# Full test suite on every push (any branch) and pull request: Rust tests +
# clippy across the whole workspace and the frontend check (biome, tsc,
# vitest, i18n keys). The Windows job is authoritative (it also runs the
# Windows-only cfg tests); the Linux job guards the shared backend and the
# frontend on a faster runner.

on:
  push:
    branches:
      - '**'
    # Documentation-only commits (only .md files) skip the test suite.
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # The Tauri backend links against glib/GTK/WebKit on Linux; the shared
      # runner does not ship them (glib-sys fails to build otherwise).
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests (workspace)
        run: cargo test --workspace

      - name: Clippy (workspace, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Frontend check
        run: npm run check

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests (workspace)
        run: cargo test --workspace

      - name: Clippy (workspace, warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Frontend check
        run: npm run check
