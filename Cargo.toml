[workspace]
resolver = "3"
members = ["crates/gxs-core", "src-tauri", "installer"]

[workspace.package]
version = "0.1.2-beta"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Malik <malik6@qq.com>", "GLaDOS <glados-n@agentmail.to>"]

[workspace.dependencies]
gxs-core = { path = "crates/gxs-core" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tracing = "=0.1.44"

# Key derivation is deliberately slow; unoptimised it takes many seconds in dev builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
